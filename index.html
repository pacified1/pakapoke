<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokémon Animal Taste</title>

<style>
    :root {
        --bg: #0b1020;
        --panel: #121a2f;
        --panel2: #18223b;
        --text: #f5f7ff;
        --muted: #9da8c4;
        --accent: #ffcb05;
        --accent2: #3b82f6;
        --danger: #ff4d6d;
        --border: rgba(255,255,255,.09);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at top left, #202d5c 0, transparent 35%),
            radial-gradient(circle at top right, #40224e 0, transparent 30%),
            var(--bg);
        min-height: 100vh;
    }

    header {
        padding: 36px 20px 24px;
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.6rem);
        font-weight: 900;
        letter-spacing: -2px;
    }

    header h1 span {
        color: var(--accent);
    }

    header p {
        margin: 10px auto 0;
        max-width: 700px;
        color: var(--muted);
        line-height: 1.6;
    }

    .container {
        width: min(1400px, calc(100% - 30px));
        margin: auto;
    }

    .controls {
        position: sticky;
        top: 10px;
        z-index: 20;

        display: grid;
        grid-template-columns: 1.5fr 1fr auto auto;
        gap: 10px;

        padding: 12px;
        margin-bottom: 20px;

        background: rgba(18,26,47,.88);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }

    input,
    select,
    button {
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--panel2);
        color: var(--text);
        padding: 11px 14px;
        font: inherit;
    }

    input::placeholder {
        color: #74809c;
    }

    button {
        cursor: pointer;
        font-weight: 700;
        transition: .18s ease;
    }

    button:hover {
        transform: translateY(-1px);
        border-color: rgba(255,255,255,.2);
    }

    .taste-btn {
        background: linear-gradient(135deg, #ffcb05, #ff9f1c);
        color: #171717;
        border: none;
    }

    .favorites-btn {
        background: #202b49;
    }

    .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
    }

    .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 10px 14px;
        border-radius: 12px;
        color: var(--muted);
    }

    .stat strong {
        color: var(--text);
    }

    #pokemonGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 14px;
        padding-bottom: 50px;
    }

    .card {
        position: relative;
        overflow: hidden;
        min-width: 0;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.05),
                rgba(255,255,255,.015)
            ),
            var(--panel);

        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px;

        transition: transform .2s ease, border-color .2s ease;
    }

    .card:hover {
        transform: translateY(-5px);
        border-color: rgba(255,203,5,.35);
    }

    .card.favorite {
        border-color: rgba(255,203,5,.65);
        box-shadow:
            0 0 0 1px rgba(255,203,5,.1),
            0 10px 35px rgba(255,203,5,.08);
    }

    .sprite {
        width: 100%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        background:
            radial-gradient(circle, rgba(255,255,255,.09), transparent 65%);
        border-radius: 14px;
    }

    .sprite img {
        width: 88%;
        height: 88%;
        object-fit: contain;
        image-rendering: auto;
    }

    .number {
        color: var(--muted);
        font-size: .78rem;
        margin-top: 8px;
    }

    .name {
        font-weight: 850;
        font-size: 1.05rem;
        margin: 3px 0 8px;
        text-transform: capitalize;
    }

    .categories {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    .tag {
        font-size: .68rem;
        padding: 4px 7px;
        border-radius: 999px;
        background: #202b49;
        color: #cbd5f0;
    }

    .heart {
        position: absolute;
        top: 9px;
        right: 9px;

        width: 38px;
        height: 38px;
        padding: 0;

        display: grid;
        place-items: center;

        border-radius: 50%;
        background: rgba(5,8,18,.7);
        border: 1px solid var(--border);

        font-size: 20px;
    }

    .heart.active {
        color: var(--danger);
    }

    .loading,
    .error,
    .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--muted);
    }

    .error {
        color: #ff8fa3;
    }

    /* Taste modal */

    #tasteModal {
        position: fixed;
        inset: 0;
        z-index: 100;

        display: none;
        align-items: center;
        justify-content: center;

        padding: 20px;
        background: rgba(2,5,14,.75);
        backdrop-filter: blur(8px);
    }

    #tasteModal.open {
        display: flex;
    }

    .modal {
        width: min(720px, 100%);
        max-height: 90vh;
        overflow-y: auto;

        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 24px;

        box-shadow: 0 30px 100px rgba(0,0,0,.5);
    }

    .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
    }

    .modal h2 {
        margin: 0;
        font-size: 1.8rem;
    }

    .close {
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 50%;
    }

    .taste-subtitle {
        color: var(--muted);
        margin: 8px 0 22px;
    }

    .taste-row {
        margin: 16px 0;
    }

    .taste-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-weight: 750;
    }

    .bar {
        height: 12px;
        border-radius: 999px;
        background: #222d4a;
        overflow: hidden;
    }

    .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ffcb05, #ff7b00);
    }

    .favorite-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 20px;
    }

    .favorite-pill {
        padding: 7px 10px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: .82rem;
    }

    .no-favorites {
        text-align: center;
        padding: 35px 10px;
        color: var(--muted);
    }

    @media (max-width: 850px) {
        .controls {
            grid-template-columns: 1fr 1fr;
        }

        .controls input {
            grid-column: 1 / -1;
        }
    }

    @media (max-width: 500px) {
        .container {
            width: min(100% - 18px, 1400px);
        }

        .controls {
            grid-template-columns: 1fr;
            position: static;
        }

        .controls input {
            grid-column: auto;
        }

        #pokemonGrid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .card {
            padding: 9px;
            border-radius: 14px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Poké<span>Taste</span></h1>
    <p>
        Favorite Pokémon and discover what animal categories your taste
        naturally gravitates toward.
    </p>
</header>

<main class="container">

    <div class="controls">
        <input
            id="search"
            type="search"
            placeholder="Search Pokémon..."
            autocomplete="off"
        >

        <select id="categoryFilter">
            <option value="all">All categories</option>
        </select>

        <button class="favorites-btn" id="favoritesFilter">
            ❤️ Favorites
        </button>

        <button class="taste-btn" id="tasteButton">
            ✨ My Taste
        </button>
    </div>

    <div class="stats">
        <div class="stat">
            Showing: <strong id="shownCount">0</strong>
        </div>

        <div class="stat">
            Pokémon: <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            Favorites: <strong id="favoriteCount">0</strong>
        </div>

        <div class="stat">
            Categories: <strong id="categoryCount">0</strong>
        </div>
    </div>

    <div id="status" class="loading">
        Loading Pokémon categories...
    </div>

    <div id="pokemonGrid"></div>

</main>


<!-- Taste Modal -->

<div id="tasteModal">
    <div class="modal">

        <div class="modal-header">
            <h2>✨ Your Pokémon Taste</h2>

            <button class="close" id="closeModal">
                ×
            </button>
        </div>

        <p class="taste-subtitle" id="tasteSubtitle">
            Favorite some Pokémon first.
        </p>

        <div id="tasteResults"></div>

    </div>
</div>


<script>
/*
==========================================================
CONFIG
==========================================================
*/

const CATEGORY_SOURCE =
    "https://raw.githubusercontent.com/pacified1/pakapoke/main/pokemon_by_category.js";

const IMAGE_BASE =
    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/";


/*
==========================================================
STATE
==========================================================
*/

let categoryData = {};
let pokemonMap = new Map();

let favorites = new Set(
    JSON.parse(localStorage.getItem("pokemonFavorites") || "[]")
);

let showingFavoritesOnly = false;


/*
==========================================================
DOM
==========================================================
*/

const grid = document.getElementById("pokemonGrid");
const status = document.getElementById("status");

const searchInput = document.getElementById("search");
const categoryFilter = document.getElementById("categoryFilter");

const favoritesFilter = document.getElementById("favoritesFilter");
const tasteButton = document.getElementById("tasteButton");

const shownCount = document.getElementById("shownCount");
const totalCount = document.getElementById("totalCount");
const favoriteCount = document.getElementById("favoriteCount");
const categoryCount = document.getElementById("categoryCount");

const tasteModal = document.getElementById("tasteModal");
const tasteResults = document.getElementById("tasteResults");
const tasteSubtitle = document.getElementById("tasteSubtitle");


/*
==========================================================
LOAD CATEGORY JS
==========================================================

We only extract POKEMON_BY_CATEGORY from the file.

This means we do NOT execute the rest of the GitHub JS,
which references ANIMALS and would otherwise fail here.
==========================================================
*/

async function loadCategories() {

    try {

        const response = await fetch(CATEGORY_SOURCE);

        if (!response.ok) {
            throw new Error(
                "Could not download pokemon_by_category.js"
            );
        }

        const source = await response.text();

        /*
        Find:

            const POKEMON_BY_CATEGORY = {
                ...
            };

        We extract the object only.
        */

        const startMarker =
            "const POKEMON_BY_CATEGORY =";

        const start =
            source.indexOf(startMarker);

        if (start === -1) {
            throw new Error(
                "POKEMON_BY_CATEGORY was not found."
            );
        }

        const objectStart =
            source.indexOf("{", start);

        const end =
            source.indexOf(
                "};",
                objectStart
            );

        if (objectStart === -1 || end === -1) {
            throw new Error(
                "Could not parse category object."
            );
        }

        const objectCode =
            source.slice(
                objectStart,
                end + 1
            );

        /*
        The object is valid JavaScript.

        We evaluate ONLY this extracted object,
        not the rest of the file.
        */

        categoryData =
            Function(
                '"use strict"; return (' +
                objectCode +
                ');'
            )();

        buildPokemonDatabase();
        populateCategoryFilter();
        render();

        status.style.display = "none";

    } catch (error) {

        console.error(error);

        status.className = "error";

        status.innerHTML = `
            <strong>Could not load Pokémon data.</strong>
            <br><br>
            ${escapeHTML(error.message)}
            <br><br>
            Make sure you are connected to the internet.
        `;
    }
}


/*
==========================================================
BUILD UNIQUE POKÉMON DATABASE
==========================================================
*/

function buildPokemonDatabase() {

    pokemonMap.clear();

    for (const [path, pokemonList] of Object.entries(categoryData)) {

        const parts = path.split(".");

        const group = parts[0];
        const category = parts[1] || parts[0];

        for (const name of pokemonList) {

            if (!pokemonMap.has(name)) {

                pokemonMap.set(name, {
                    name,
                    categories: [],
                    groups: []
                });
            }

            const pokemon =
                pokemonMap.get(name);

            const categoryInfo = {
                path,
                group,
                category
            };

            /*
            Avoid duplicate category tags even if the
            same Pokémon occurs twice in one array.
            */

            if (
                !pokemon.categories.some(
                    c => c.path === path
                )
            ) {
                pokemon.categories.push(categoryInfo);
            }

            if (!pokemon.groups.includes(group)) {
                pokemon.groups.push(group);
            }
        }
    }

    /*
    Sort alphabetically.
    */

    pokemonMap =
        new Map(
            [...pokemonMap.entries()]
                .sort(
                    (a, b) =>
                        a[0].localeCompare(
                            b[0]
                        )
                )
        );

    totalCount.textContent =
        pokemonMap.size;

    categoryCount.textContent =
        Object.keys(categoryData).length;

    updateFavoriteCount();
}


/*
==========================================================
CATEGORY FILTER
==========================================================
*/

function populateCategoryFilter() {

    const categories =
        Object.keys(categoryData)
            .sort((a, b) =>
                a.localeCompare(b)
            );

    for (const path of categories) {

        const option =
            document.createElement("option");

        option.value = path;

        option.textContent =
            formatCategory(path);

        categoryFilter.appendChild(option);
    }
}


/*
==========================================================
RENDER
==========================================================
*/

function render() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const selectedCategory =
        categoryFilter.value;

    const pokemon =
        [...pokemonMap.values()]
            .filter(p => {

                /*
                Search
                */

                if (
                    search &&
                    !p.name
                        .toLowerCase()
                        .includes(search)
                ) {
                    return false;
                }

                /*
                Category
                */

                if (
                    selectedCategory !== "all" &&
                    !p.categories.some(
                        c =>
                            c.path ===
                            selectedCategory
                    )
                ) {
                    return false;
                }

                /*
                Favorites
                */

                if (
                    showingFavoritesOnly &&
                    !favorites.has(p.name)
                ) {
                    return false;
                }

                return true;
            });

    grid.innerHTML = "";

    shownCount.textContent =
        pokemon.length;

    if (!pokemon.length) {

        grid.innerHTML = `
            <div class="empty">
                No Pokémon found.
            </div>
        `;

        return;
    }

    const fragment =
        document.createDocumentFragment();

    pokemon.forEach((p, index) => {

        const card =
            document.createElement("article");

        card.className =
            "card" +
            (
                favorites.has(p.name)
                    ? " favorite"
                    : ""
            );

        /*
        Try to identify National Dex number.

        This uses the normal PokéAPI numeric image
        convention. For names not matching an ID,
        the image simply falls back.
        */

        const imageId =
            guessPokemonId(
                p.name,
                index
            );

        const imageUrl =
            IMAGE_BASE +
            imageId +
            ".png";

        const tags =
            p.categories
                .slice(0, 5)
                .map(c =>
                    `<span class="tag">
                        ${escapeHTML(
                            formatCategory(
                                c.path
                            )
                        )}
                    </span>`
                )
                .join("");

        const extra =
            p.categories.length > 5
                ? `<span class="tag">
                    +${p.categories.length - 5}
                  </span>`
                : "";

        card.innerHTML = `

            <button
                class="heart ${
                    favorites.has(p.name)
                        ? "active"
                        : ""
                }"
                title="${
                    favorites.has(p.name)
                        ? "Remove favorite"
                        : "Add favorite"
                }"
                aria-label="${
                    favorites.has(p.name)
                        ? "Remove favorite"
                        : "Add favorite"
                }"
            >
                ${
                    favorites.has(p.name)
                        ? "♥"
                        : "♡"
                }
            </button>

            <div class="sprite">

                <img
                    src="${imageUrl}"
                    alt="${escapeHTML(p.name)}"
                    loading="lazy"
                    onerror="this.style.opacity='0'"
                >

            </div>

            <div class="number">
                #${String(index + 1).padStart(4, "0")}
            </div>

            <div class="name">
                ${escapeHTML(p.name)}
            </div>

            <div class="categories">
                ${tags}
                ${extra}
            </div>
        `;

        const heart =
            card.querySelector(".heart");

        heart.addEventListener(
            "click",
            () => toggleFavorite(p.name)
        );

        fragment.appendChild(card);
    });

    grid.appendChild(fragment);
}


/*
==========================================================
FAVORITES
==========================================================
*/

function toggleFavorite(name) {

    if (favorites.has(name)) {
        favorites.delete(name);
    } else {
        favorites.add(name);
    }

    localStorage.setItem(
        "pokemonFavorites",
        JSON.stringify(
            [...favorites]
        )
    );

    updateFavoriteCount();
    render();
}


function updateFavoriteCount() {

    favoriteCount.textContent =
        favorites.size;
}


/*
==========================================================
TASTE CALCULATOR
==========================================================

Example:

Favorites:
    Vulpix
    Growlithe
    Zorua

Vulpix -> fox
Growlithe -> dog
Zorua -> fox

Therefore:

Fox = 2 / 3 = 66.7%
Dog = 1 / 3 = 33.3%

If one Pokémon belongs to multiple categories,
EVERY matching category receives one vote.

==========================================================
*/

function calculateTaste() {

    const scores = {};

    for (const name of favorites) {

        const pokemon =
            pokemonMap.get(name);

        if (!pokemon) continue;

        for (const category of pokemon.categories) {

            /*
            Convert:

                canine.fox

            into:

                Fox
            */

            const label =
                formatCategory(
                    category.path
                );

            scores[label] =
                (scores[label] || 0) + 1;
        }
    }

    const total =
        Object.values(scores)
            .reduce(
                (sum, value) =>
                    sum + value,
                0
            );

    return {
        scores,
        total
    };
}


/*
==========================================================
SHOW TASTE
==========================================================
*/

function showTaste() {

    tasteResults.innerHTML = "";

    if (favorites.size === 0) {

        tasteSubtitle.textContent =
            "You haven't favorited any Pokémon yet.";

        tasteResults.innerHTML = `
            <div class="no-favorites">
                ❤️ Favorite some Pokémon first,
                then I'll figure out your animal taste.
            </div>
        `;

        tasteModal.classList.add("open");

        return;
    }

    const {
        scores,
        total
    } = calculateTaste();

    const results =
        Object.entries(scores)
            .map(([category, score]) => {

                const percentage =
                    (score / total) * 100;

                return {
                    category,
                    score,
                    percentage
                };
            })
            .sort(
                (a, b) =>
                    b.percentage -
                    a.percentage
            );

    tasteSubtitle.textContent =
        `Based on ${favorites.size} favorite Pokémon.`;

    /*
    Top 12 categories
    */

    results
        .slice(0, 12)
        .forEach(result => {

            const row =
                document.createElement("div");

            row.className =
                "taste-row";

            row.innerHTML = `

                <div class="taste-label">

                    <span>
                        ${escapeHTML(
                            result.category
                        )}
                    </span>

                    <span>
                        ${formatPercentage(
                            result.percentage
                        )}
                    </span>

                </div>

                <div class="bar">

                    <div
                        class="bar-fill"
                        style="width:${result.percentage}%"
                    ></div>

                </div>
            `;

            tasteResults.appendChild(row);
        });

    /*
    Favorite list
    */

    const favoriteTitle =
        document.createElement("h3");

    favoriteTitle.textContent =
        "Your favorites";

    favoriteTitle.style.marginTop =
        "30px";

    tasteResults.appendChild(
        favoriteTitle
    );

    const favoriteList =
        document.createElement("div");

    favoriteList.className =
        "favorite-list";

    [...favorites]
        .sort((a, b) =>
            a.localeCompare(b)
        )
        .forEach(name => {

            const pill =
                document.createElement("span");

            pill.className =
                "favorite-pill";

            pill.textContent =
                "❤️ " + name;

            favoriteList.appendChild(
                pill
            );
        });

    tasteResults.appendChild(
        favoriteList
    );

    tasteModal.classList.add("open");
}


/*
==========================================================
HELPERS
==========================================================
*/

function formatCategory(path) {

    const parts =
        path.split(".");

    const group =
        parts[0] || "";

    const category =
        parts[1] || group;

    /*
    camelCase -> words
    */

    const readable =
        category
            .replace(
                /([a-z])([A-Z])/g,
                "$1 $2"
            )
            .replace(
                /[-_]/g,
                " "
            );

    return capitalize(
        readable
    );
}


function capitalize(text) {

    return text
        .split(" ")
        .map(word =>
            word
                ? word[0].toUpperCase() +
                  word.slice(1)
                : ""
        )
        .join(" ");
}


function formatPercentage(value) {

    if (value >= 10) {
        return Math.round(value) + "%";
    }

    return value.toFixed(1) + "%";
}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
==========================================================
POKÉMON ID HANDLING
==========================================================

The category JS mostly contains names rather than IDs.
For artwork we need an ID.

This table handles the Pokémon names appearing as
special/form names in the supplied category file.

For ordinary Pokémon, we use a name -> PokéAPI lookup
and cache the result.
==========================================================
*/

const idCache =
    JSON.parse(
        localStorage.getItem(
            "pokemonImageIds"
        ) || "{}"
    );


const specialIds = {

    /*
    Regional forms in the source can be displayed
    using the base Pokémon artwork.
    */

    "Hisuian Growlithe": 58,
    "Hisuian Arcanine": 59,

    /*
    Common apostrophe/name handling
    */

    "Farfetch'd": 83,

    /*
    Some Pokémon where the normal spelling is
    particularly useful.
    */

    "Nidoran♀": 29,
    "Nidoran♂": 32
};


function guessPokemonId(name, fallback) {

    /*
    If cached, use it.
    */

    if (idCache[name]) {
        return idCache[name];
    }

    /*
    Special cases.
    */

    if (specialIds[name]) {
        return specialIds[name];
    }

    /*
    We cannot reliably convert every Pokémon name
    to its numeric National Dex ID locally.

    Instead, use a temporary deterministic placeholder
    until the PokéAPI lookup completes.

    The actual image is replaced after lookup.
    */

    return fallback;
}


/*
==========================================================
BETTER IMAGE LOOKUP

Cards initially receive fallback images.
Then we ask PokéAPI for each Pokémon's actual ID.

This avoids having to hardcode all 1,025 IDs.
==========================================================
*/

async function resolveImageIds() {

    const promises =
        [...pokemonMap.values()]
            .map(async pokemon => {

                if (
                    idCache[pokemon.name] ||
                    specialIds[pokemon.name]
                ) {
                    return;
                }

                try {

                    const slug =
                        pokemon.name
                            .toLowerCase()
                            .replace(
                                /['’]/g,
                                ""
                            )
                            .replace(
                                /[^a-z0-9]+/g,
                                "-"
                            )
                            .replace(
                                /^-|-$/g,
                                ""
                            );

                    const response =
                        await fetch(
                            "https://pokeapi.co/api/v2/pokemon/" +
                            slug
                        );

                    if (!response.ok) {
                        return;
                    }

                    const data =
                        await response.json();

                    if (data.id) {

                        idCache[pokemon.name] =
                            data.id;

                        localStorage.setItem(
                            "pokemonImageIds",
                            JSON.stringify(
                                idCache
                            )
                        );
                    }

                } catch {
                    /*
                    Ignore individual failures.
                    */
                }
            });

    await Promise.allSettled(promises);

    /*
    Re-render after IDs are available.
    */

    render();
}

/*

START
==========================================================
*/

(async function init() {

    await loadCategories();

    /*
    Resolve real Pokémon artwork IDs
    in the background.
    */

    resolveImageIds();

})();
